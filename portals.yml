    label: "IrishJobs — Software Engineer/Developer/Cloud/Junior"

  - query: "site:irishjobs.ie \"full stack\" OR \"full-stack\" developer OR engineer Dublin"
    enabled: true
    label: "IrishJobs — Full Stack"

