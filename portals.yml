search_queries:
  - name: IrishJobs — Software Engineer Dublin
    query: 'site:irishjobs.ie "software engineer" OR "software developer" OR "cloud engineer" OR "Junior" Dublin'
    enabled: true

  - name: IrishJobs — Full Stack Dublin
    query: 'site:irishjobs.ie "full stack" OR "full-stack" developer OR engineer Dublin'
    enabled: true

  - name: IrishJobs — AI/ML Dublin
    query: 'site:irishjobs.ie "AI engineer" OR "machine learning" OR "applied AI" Dublin'
    enabled: true

  - name: IrishJobs — Product Owner Dublin
    query: 'site:irishjobs.ie "product owner" OR "product manager" Dublin technology'
    enabled: true

  - name: IrishJobs — QA Dublin
    query: 'site:irishjobs.ie "QA engineer" OR "quality assurance" OR "test engineer" Dublin'
    enabled: true

  - name: IrishJobs — Data Dublin
    query: 'site:irishjobs.ie "data analyst" OR "data engineer" OR "business intelligence" Dublin'
    enabled: true

  - name: IrishJobs — Graduate Dublin
    query: 'site:irishjobs.ie "graduate programme" OR "graduate engineer" OR "technology graduate" Dublin'
    enabled: true

  - name: Indeed IE — Software Engineer
    query: 'site:ie.indeed.com "software engineer" OR "software developer" "cloud engineer" OR "Junior" Dublin'
    enabled: true

  - name: Indeed IE — AI/ML
    query: 'site:ie.indeed.com "AI engineer" OR "machine learning" OR "NLP" Dublin Ireland'
    enabled: true

  - name: Silicon Republic — Software Engineer
    query: 'site:siliconrepublic.com/jobs "software engineer" OR "developer" Dublin Ireland'
    enabled: true

  - name: Silicon Republic — AI/ML
    query: 'site:siliconrepublic.com/jobs "AI" OR "machine learning" OR "generative" Dublin Ireland'
    enabled: true

  - name: Greenhouse — Software/Dev Dublin
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "software engineer" OR "developer" "Dublin" OR "Ireland"'
    enabled: true

  - name: Ashby — Software/Cloud Dublin
    query: 'site:jobs.ashbyhq.com "software engineer" "cloud engineer" OR "Junior" Dublin OR Ireland'
    enabled: true

  - name: Ashby — AI Engineer Dublin
    query: 'site:jobs.ashbyhq.com "AI engineer" OR "applied AI" Dublin OR Ireland'
    enabled: true

  - name: WorkAtAStartup — Remote Europe
    query: 'site:workatastartup.com "software engineer" OR "full stack" remote Europe OR Ireland'
    enabled: true

